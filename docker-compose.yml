services:
  workbot:
    container_name: workbot
    build: .
    restart: unless-stopped
    networks:
      nginx_net:
    env_file:
      - .env
    volumes:
      - ./src/logs:/src/logs
      - ./src/bot/logs:/src/bot/logs
